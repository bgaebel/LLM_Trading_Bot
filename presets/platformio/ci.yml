name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Platforms, toolchains and frameworks (~1 GB for ESP32); key changes when platformio.ini changes
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install tools
        run: pip install -r requirements-dev.txt

      - name: Format check
        run: |
          files=$(git ls-files '*.c' '*.cpp' '*.h' '*.hpp')
          [ -z "$files" ] || clang-format --dry-run --Werror $files

      - name: Host unit tests
        run: pio test -e native

      - name: Build firmware
        run: pio run -e esp32dev

      - name: Static analysis
        run: pio check -e esp32dev --fail-on-defect=medium --fail-on-defect=high

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-esp32dev
          path: .pio/build/esp32dev/firmware.bin
          if-no-files-found: error
