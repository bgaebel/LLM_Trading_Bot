; PlatformIO project configuration
; Docs: https://docs.platformio.org/page/projectconf/index.html

[platformio]
default_envs = esp32dev

; Shared by all envs
[env]
test_framework = unity
check_tool = cppcheck
; Analyze project code only; the default filter covers src/ and include/ but not lib/
check_src_filters = +<src/> +<include/> +<lib/>
check_skip_packages = yes
check_severity = medium, high
check_flags =
    cppcheck: --enable=warning,style,performance,portability --inline-suppr

[env:esp32dev]
; Pin platform versions: an unpinned platform silently pulls a new toolchain/core
platform = espressif32 @ 8.0.0
board = esp32dev
framework = arduino
build_flags = -Wall -Wextra
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Host-only tests must not be built for the target
test_ignore = test_native

[env:native]
; Host build for unit tests of pure logic in lib/ (needs gcc/g++ on PATH).
; No -std here: build_flags also reach the C compiler (Unity); g++ defaults to gnu++17 or newer.
platform = native @ 1.2.1
build_flags = -Wall -Wextra
test_filter = test_native
