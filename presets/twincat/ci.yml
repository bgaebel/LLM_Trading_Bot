name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Option A: GitHub-hosted runners cannot build TwinCAT (no XAE, licensing, Windows-only GUI tooling).
  # Only static checks: XML well-formedness, UTF-8, POU name = file name, plcproj references, no _Boot etc.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Standard library only -> nothing to install or cache.
      - name: TwinCAT repository checks
        run: python scripts/check-twincat.py

