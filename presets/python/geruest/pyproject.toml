[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.12"
dependencies = []

[project.scripts]
app = "app:main"

[dependency-groups]
# Installed by default with `uv sync`.
dev = [
    "pytest>=9.0",
    "ruff>=0.17",
    "mypy>=2.0",
]

[build-system]
# Default backend of `uv init --package`; bump the bound when upgrading uv.
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
