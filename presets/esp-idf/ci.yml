name: CI

on:
  push:
    branches: [main]
  pull_request:

# Keep the image tag in sync with the IDF version in CLAUDE.md ("Stack:").
# Alternative: espressif/esp-idf-ci-action@v1 (simpler, but no ccache caching).

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install clang-format
        run: pip install clang-format==18.1.8
      - name: Check formatting
        run: git ls-files '*.c' '*.h' | xargs -r clang-format --dry-run --Werror

  host-test:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    env:
      IDF_CCACHE_ENABLE: 1
      CCACHE_DIR: /tmp/ccache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: /tmp/ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-
      - name: Build and run host tests (linux target)
        shell: bash
        run: |
          # Container jobs bypass the image entrypoint, so the IDF env must be exported explicitly.
          . "$IDF_PATH/export.sh"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd test/host
          idf.py --preview set-target linux
          idf.py build
          ./build/host_test.elf

  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    strategy:
      matrix:
        target: [esp32]
    env:
      IDF_CCACHE_ENABLE: 1
      CCACHE_DIR: /tmp/ccache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/cache@v6
        with:
          path: /tmp/ccache
          key: ccache-${{ matrix.target }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.target }}-
      - name: Build firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          idf.py set-target ${{ matrix.target }}
          idf.py build
          idf.py size
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.target }}
          path: |
            build/*.bin
            build/*.elf
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
          if-no-files-found: error
