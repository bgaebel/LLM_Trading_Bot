name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Target board for the firmware build. native_sim needs no HAL; for a real
  # board add its HAL to west.yml name-allowlist and the toolchain below.
  BOARD: native_sim

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: clang-format check
        # ubuntu-24.04 image ships clang-format 16/17/18; pin 18 explicitly.
        run: |
          files=$(git ls-files 'app/*.c' 'app/*.h' 'tests/*.c' 'tests/*.h')
          [ -z "$files" ] || clang-format-18 --dry-run --Werror $files

  build-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # action-zephyr-setup runs "west init -l <app-path>" (T2 topology),
          # so the repo must live in a subdirectory of the workspace.
          path: app-repo

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Zephyr workspace + SDK
        # Installs ccache/gperf/g++-multilib (32-bit native_sim), runs west init -l +
        # shallow west update, pip deps, SDK; caches pip, SDK and ccache.
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: app-repo
          toolchains: arm-zephyr-eabi

      - name: Build firmware
        working-directory: app-repo
        run: west build -b "$BOARD" app -p always

      - name: Host tests (Twister, native_sim)
        working-directory: app-repo
        run: west twister -T tests -p native_sim -v --inline-logs

      - name: Upload Twister results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: twister-out
          path: app-repo/twister-out/
          if-no-files-found: ignore
