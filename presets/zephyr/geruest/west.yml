# West manifest (T2 topology): this repo is the manifest repo.
# Init: west init -l <this-repo> && west update
manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.5.0 # pin a release tag, never "main"
      import:
        # Only clone the modules the target needs; add the HAL of your SoC
        # (e.g. hal_nordic, hal_stm32, hal_espressif). native_sim needs none.
        name-allowlist:
          - cmsis_6
