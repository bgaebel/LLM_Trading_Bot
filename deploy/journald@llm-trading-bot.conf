# Origin: LLM-Trading-Arena@7563724 journald limits (adapted)
# Journal of the namespace llm-trading-bot (LogNamespace= in both units, and in caddy's drop-in once
# release.sh public ran): bounded in size and age.
# Installed with roadmap Nr. 6 to /etc/systemd/journald@llm-trading-bot.conf.
# Read with: journalctl --namespace=llm-trading-bot -u llm-trading-bot
#
# Spec 014 / ADR-0025: Caddy's warnings carry visitors' IP addresses. MaxRetentionSec only drops whole
# journal files, so a file may hold entries up to MaxFileSec older than the limit: at most 14 + 1 = 15
# days, the figure the privacy notice names. Nothing goes on to syslog, which keeps its own (longer)
# rotation.
[Journal]
Storage=persistent
SystemMaxUse=200M
RuntimeMaxUse=50M
MaxRetentionSec=14day
MaxFileSec=1day
ForwardToSyslog=no
