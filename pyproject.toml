[project]
name = "llm-trading-bot"
version = "0.1.0"
description = "Trading bot for BTC/EUR and ETH/EUR building on LLM Trading Arena (paper first)"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.46.0",
]

[project.scripts]
trading-bot = "llm_trading_bot:main"

[dependency-groups]
# Installed by default with `uv sync`.
dev = [
    "pytest>=9.0",
    "ruff>=0.17",
    "mypy>=2.0",
    "shellcheck-py>=0.11.0.1",
]

[build-system]
# Default backend of `uv init --package`; bump the bound when upgrading uv.
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib", "-m", "not net"]
markers = ["net: talks to a real external API (Bitvavo, OpenAI); excluded by default, run with -m net"]
# Shared test helpers (tests/fakes.py) are imported as top-level modules.
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# German UI texts use typographic dashes on purpose.
"src/llm_trading_bot/web/*.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src,tests"
