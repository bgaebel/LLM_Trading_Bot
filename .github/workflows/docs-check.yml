name: Docs check

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "CLAUDE.md"
      - "scripts/docs-check.sh"
      - ".github/workflows/docs-check.yml"
  pull_request:
    paths:
      - "docs/**"
      - "CLAUDE.md"
      - "scripts/docs-check.sh"
      - ".github/workflows/docs-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check documentation hygiene
        run: bash scripts/docs-check.sh
