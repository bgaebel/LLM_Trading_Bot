name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Add windows-latest via a matrix if the code touches paths, encodings or subprocesses.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tag since v8 -> pin the full version.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Python version comes from .python-version; --locked fails if uv.lock is stale.
      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format
        run: uv run ruff format --check .

      - name: Shell lint
        # bash -n checks only its first argument, so loop over every file.
        run: |
          for f in deploy/*.sh scripts/*.sh; do bash -n "$f"; done
          uv run shellcheck deploy/*.sh scripts/*.sh

      - name: Caddy
        # Spec 013 AK7: the same official, signed repository the server uses (deploy/release.sh).
        run: |
          curl -1sSLf https://dl.cloudsmith.io/public/caddy/stable/gpg.key \
            | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/caddy-stable-archive-keyring.gpg] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main" \
            | sudo tee /etc/apt/sources.list.d/caddy-stable.list >/dev/null
          sudo apt-get -o DPkg::Lock::Timeout=300 -qq update
          sudo apt-get -o DPkg::Lock::Timeout=300 -y -qq install --no-install-recommends caddy
          caddy version

      - name: systemd units and Caddyfile
        # Spec 008 AK10, Spec 013 AK7: the units in deploy/ with test values, verified by systemd
        # itself (web unit with and without a public host), and the Caddyfile by caddy validate.
        run: bash scripts/check-units.sh

      - name: Type check
        run: uv run mypy src tests tools

      - name: Test
        # Tests marked `net` hit the real Bitvavo API and stay out of CI.
        run: uv run pytest -m "not net"
